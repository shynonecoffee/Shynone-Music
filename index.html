<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHYNONE - Wunanga la Moçambique</title>
<style>
body{font-family:Arial;background:#000;color:#fff;text-align:center;margin:0;padding:20px}
header{padding:30px 0}
h1{font-size:42px;margin:10px;color:#FFD700}
.lang-btn{padding:8px 15px;margin:5px;border:1px solid #FFD700;background:#000;color:#FFD700;cursor:pointer;border-radius:20px}
.lang-btn.active{background:#FFD700;color:#000}
.card{background:#111;padding:20px;margin:20px auto;max-width:400px;border-radius:15px;border:1px solid #333}
.btn{background:#FFD700;color:#000;padding:12px 25px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>

<header>
<h1>SHYNONE</h1>
<!-- TITLES IN 3 LANGUAGES -->
<h2 id="title-pt">Música Moçambicana para o Mundo</h2>
<h2 id="title-en" style="display:none">Mozambican Music to the World</h2>
<h2 id="title-ch" style="display:none">Wunanga la Moçambique</h2>

<div>
<button class="lang-btn active" onclick="setLang('pt')">PT</button>
<button class="lang-btn" onclick="setLang('en')">EN</button>
<button class="lang-btn" onclick="setLang('ch')">CH - Wunanga</button>
</div>
</header>

<div class="card">
<h3 id="song-title">Minha Nova Música</h3>
<p id="price">Apoiar com 100MT via M-Pesa</p>
<button class="btn" onclick="pagar()">Pagar com M-Pesa</button>
<p style="font-size:12px;color:#888;margin-top:10px">84 XX XX XX XX - Envie comprovativo no WhatsApp</p>
</div>

<script>
function setLang(l){
document.getElementById('title-pt').style.display=l=='pt'?'block':'none';
document.getElementById('title-en').style.display=l=='en'?'block':'none';
document.getElementById('title-ch').style.display=l=='ch'?'block':'none';
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
}
function pagar(){
alert('M-Pesa: 84 XX XX XX - Obrigado! / Thank you! / Inkomu! Wunanga la Moçambique!');
}
</script>

</body>
</html>
