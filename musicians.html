<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Músicos - SHYNONE MUSIC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding:20px}
a{color:#FFD700;text-decoration:none}
.header{display:flex;align-items:center;gap:15px;margin-bottom:25px}
.back{border:1px solid #FFD700;padding:8px 15px;border-radius:20px}
.logo{font-weight:900;color:#FFD700}
.list{max-width:600px;margin:0 auto}
.musician{background:#111;border:1px solid #222;border-radius:15px;padding:15px;display:flex;align-items:center;gap:15px;margin-bottom:12px;transition:0.3s}
.musician:hover{border-color:#FFD700;background:#1a1a1a}
.avatar{width:60px;height:60px;background:linear-gradient(45deg,#FFD700,#FF8C00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#000}
.info{flex:1;text-align:left}
.info h3{color:#fff;font-size:16px}
.info p{color:#888;font-size:12px}
.play{width:40px;height:40px;background:#FFD700;border:none;border-radius:50%;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<a href="index.html" class="back">← Voltar</a>
<div class="logo">SHYNONE MUSIC - Lista</div>
</div>

<div class="list">
<div class="musician">
<div class="avatar">S</div>
<div class="info"><h3>SHYNONE</h3><p>Wunanga la Moçambique - Beira</p></div>
<button class="play">▶️</button>
</div>

<div class="musician">
<div class="avatar">M1</div>
<div class="info"><h3>Músico 1</h3><p>Marrabenta - Maputo</p></div>
<button class="play">▶️</button>
</div>

<div class="musician">
<div class="avatar">M2</div>
<div class="info"><h3>Músico 2</h3><p>Pandza - Beira</p></div>
<button class="play">▶️</button>
</div>

<div class="musician">
<div class="avatar">M3</div>
<div class="info"><h3>Músico 3</h3><p>Hip Hop - Nampula</p></div>
<button class="play">▶️</button>
</div>

<div class="musician">
<div class="avatar">+</div>
<div class="info"><h3>Adicionar Músico</h3><p>Entre em contacto no WhatsApp</p></div>
<button class="play" style="background:#25D366">+</button>
</div>
</div>

</body>
</html>
